<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة الإدارة - ملفاتي الجامعية</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#12284a;--mut:#5b6c88;--line:#d9e1ee;--bar:#12284a;--accent:#2f7de1;--soft:#eaf2fd;--bad:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#0d1525;--card:#15213a;--ink:#e8eefb;--mut:#9eb0cd;--line:#26365a;--bar:#09111f;--accent:#5b9cf0;--soft:#1b2c4d;--bad:#ff7a6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 Cairo,Tahoma,"Segoe UI",system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{background:var(--bar);color:#fff}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}
header .wrap{display:flex;justify-content:space-between;align-items:center;height:64px;font-weight:600;font-size:19px}
header a,header button{color:#fff;font-size:15px;font-weight:400;background:none;border:0;cursor:pointer;text-decoration:underline;font-family:inherit}
h1{font-size:28px;margin:32px 0 6px}
p.sub{color:var(--mut);margin:0 0 22px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
input[type=text],input[type=password]{flex:1;min-width:200px;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
button.btn{font:inherit;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
button.link{font:inherit;font-size:14px;background:none;border:0;color:var(--bad);cursor:pointer;padding:4px 6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h3{margin:0;font-size:19px}
ul{list-style:none;margin:12px 0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
li span{overflow-wrap:anywhere}
.add{display:inline-block;color:var(--accent);font-weight:600;cursor:pointer;border:1px dashed var(--accent);border-radius:8px;padding:9px 14px}
.add input{display:none}
.add:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.mut{color:var(--mut)}
#msg{position:sticky;top:0;margin:12px 0;padding:10px 14px;border-radius:8px;background:var(--soft);display:none}
#msg.err{color:var(--bad)}
#login{max-width:420px;margin:60px auto}
</style>
</head>
<body>
<header><div class="wrap"><span>لوحة الإدارة</span><span><a href="/">عرض الموقع</a> <button id="out" hidden>تسجيل الخروج</button></span></div></header>
<main class="wrap">
  <div id="msg" role="status"></div>

  <form id="login" class="box">
    <h3>تسجيل دخول المشرف</h3>
    <p class="mut">أدخل كلمة مرور المشرف لإدارة المواد والملفات.</p>
    <div class="row"><input id="pw" type="password" placeholder="كلمة المرور" aria-label="كلمة مرور المشرف" autocomplete="current-password" required>
    <button class="btn">تسجيل الدخول</button></div>
  </form>

  <div id="panel" hidden>
    <h1>المواد والملفات</h1>
    <p class="sub">تظهر التغييرات في الموقع العام فوراً.</p>
    <form id="newSub" class="box row">
      <input id="name" type="text" placeholder="اسم المادة الجديدة، مثل: التشريح" aria-label="اسم المادة الجديدة" required>
      <button class="btn">إضافة مادة</button>
    </form>
    <div id="list"></div>
  </div>
</main>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let pw=sessionStorage.getItem("pw")||"";

function say(t,err){const m=$("#msg");m.textContent=t;m.className=err?"err":"";m.style.display=t?"block":"none"}

async function api(url,opt={}){
  const h={"x-admin-password":pw};
  if(typeof opt.body==="string")h["Content-Type"]="application/json";
  const r=await fetch(url,{...opt,headers:h});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||"حدث خطأ ما");
  return j;
}

async function render(){
  const subs=await (await fetch("api/subjects")).json();
  $("#list").innerHTML=subs.length?subs.map(s=>`
    <section class="box" data-id="${s.id}">
      <div class="top"><h3>${esc(s.name)}</h3><button class="link" data-act="delSub">حذف المادة</button></div>
      <ul>${s.files.length?s.files.map(f=>`<li><span dir="auto">${esc(f.n)}</span><button class="link" data-act="delFile" data-n="${encodeURIComponent(f.n)}">حذف</button></li>`).join(""):'<li class="mut">لا توجد ملفات بعد.</li>'}</ul>
      <label class="add">إضافة ملفات<input type="file" multiple></label>
    </section>`).join(""):'<p class="mut">لا توجد مواد بعد. أضف أول مادة من الأعلى.</p>';
}

function show(on){$("#login").hidden=on;$("#panel").hidden=!on;$("#out").hidden=!on}

async function enter(){
  try{await api("api/check");sessionStorage.setItem("pw",pw);show(true);await render()}
  catch(e){show(false);if(pw)say(e.message,true)}
}

$("#login").onsubmit=e=>{e.preventDefault();pw=$("#pw").value;say("");enter()};
$("#out").onclick=()=>{sessionStorage.removeItem("pw");pw="";show(false)};

$("#newSub").onsubmit=async e=>{
  e.preventDefault();
  try{await api("api/subjects",{method:"POST",body:JSON.stringify({name:$("#name").value})});$("#name").value="";say("تمت إضافة المادة.");await render()}
  catch(x){say(x.message,true)}
};

$("#list").onclick=async e=>{
  const b=e.target.closest("button");if(!b)return;
  const id=b.closest("section").dataset.id;
  try{
    if(b.dataset.act==="delSub"){
      if(!confirm("هل تريد حذف هذه المادة وجميع ملفاتها؟"))return;
      await api("api/subjects/"+id,{method:"DELETE"});say("تم حذف المادة.");
    }else{
      if(!confirm("هل تريد حذف هذا الملف؟"))return;
      await api(`api/subjects/${id}/files/${b.dataset.n}`,{method:"DELETE"});say("تم حذف الملف.");
    }
    await render();
  }catch(x){say(x.message,true)}
};

$("#list").onchange=async e=>{
  const inp=e.target;if(inp.type!=="file"||!inp.files.length)return;
  const fd=new FormData();for(const f of inp.files)fd.append("files",f);
  say("جارٍ الرفع...");
  try{await api(`api/subjects/${inp.closest("section").dataset.id}/files`,{method:"POST",body:fd});say("تم رفع الملفات.");await render()}
  catch(x){say(x.message,true)}
};

if(pw)enter();
</script>
</body>
</html>
